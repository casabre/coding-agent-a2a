name: Publish

# Triggered by version tags: 1.2.3, 1.2.3-beta.1, v1.2.3, v1.2.3-beta.1, etc.
# A leading "v" is stripped so the published version is always bare semver.
# After publishing, the version bump is committed back to main.
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push version bump commit to main
      id-token: write        # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version

      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.value }}"
          git push origin main
