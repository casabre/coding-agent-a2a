{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coding-agent-a2a.fullname" . }}-auth
  labels:
    {{- include "coding-agent-a2a.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.issuer }}
  AUTH_ISSUER: {{ .Values.auth.issuer | quote }}
  {{- end }}
  {{- if .Values.auth.audience }}
  AUTH_AUDIENCE: {{ .Values.auth.audience | quote }}
  {{- end }}
  {{- if .Values.auth.jwksUri }}
  AUTH_JWKS_URI: {{ .Values.auth.jwksUri | quote }}
  {{- end }}
{{- end }}
